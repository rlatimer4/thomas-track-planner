[package]
name = "track-planner"
version = "0.1.0"
description = "Layout planner for Thomas & Friends TrackMaster-style motorized train track"
edition = "2021"
license = "MIT"

[lib]
# The library form is what Tauri's mobile targets (iOS/Android) load.
name = "track_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
